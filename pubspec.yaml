name: profit_connect_mobile
description: "A professional CareerPath application for networking and job search."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
   
  # Core
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  dartz: ^0.10.1
  
  # Network & Storage
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.4
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.1.0
  
  # UI & Animation
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  
  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_linkedin: ^1.4.0
  
  # Media & Files
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  flutter_native_splash: ^2.4.4
  
  # Utilities
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5
  share_plus: ^10.0.0
  permission_handler: ^11.3.1
  logger: ^2.7.0
  talker: ^4.5.0
  talker_flutter: ^4.5.0
  
  # Infrastructure
  internet_connection_checker_plus: ^2.5.1
  app_links: ^6.3.3
  web_socket_channel: ^3.0.2
  http: ^1.2.2

  # Firebase
  firebase_core: ^3.1.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Monitoring
  sentry_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.12
  very_good_analysis: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 23
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background: "#004D40"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#004D40"
    theme_color: "#004D40"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.svg