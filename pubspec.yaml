name: my_first_app
description: "A professional CareerPath application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Pinning intl to 0.20.2 to match flutter_localizations requirement
  intl: 0.20.2

  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.0.7
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.3
  internet_connection_checker_plus: ^2.5.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.4
  audioplayers: ^5.2.1
  dartz: ^0.10.1
  logger: ^2.7.0
  shimmer: ^3.0.0
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

# تم تعطيل الإشارة لملف .png المفقود حالياً لتجنب أخطاء البناء
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.svg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.svg
